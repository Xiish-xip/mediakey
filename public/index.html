<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediaKey — Download Your Content</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #ff7e5f, #feb47b, #6a82fb, #191654);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="glass w-full max-w-md rounded-2xl p-6 text-white">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold mb-2">MediaKey</h1>
      <p class="opacity-90">Paste your social link → Download your content</p>
      <div class="flex justify-center gap-2 mt-3">
        <i class="fab fa-youtube text-red-500"></i>
        <i class="fab fa-tiktok text-black"></i>
        <i class="fab fa-instagram text-pink-500"></i>
        <i class="fab fa-twitter text-blue-400"></i>
        <i class="fab fa-reddit text-orange-500"></i>
      </div>
    </div>

    <input
      type="text"
      id="urlInput"
      placeholder="https://youtube.com/... or https://tiktok.com/..."
      class="w-full p-3 rounded-lg mb-4 bg-white/20 border border-white/30 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />

    <div class="grid grid-cols-2 gap-2 mb-4">
      <button onclick="pasteClipboard()" class="py-2 rounded-lg bg-white/20 hover:bg-white/30 flex items-center justify-center gap-1">
        <i class="fas fa-paste"></i> Paste
      </button>
      <button onclick="fetchInfo()" class="py-2 rounded-lg bg-blue-600 hover:bg-blue-700 flex items-center justify-center gap-1">
        <i class="fas fa-key"></i> Unlock
      </button>
    </div>

    <div id="loading" class="hidden text-center py-4">
      <div class="inline-block h-6 w-6 animate-spin rounded-full border-4 border-white border-t-transparent"></div>
      <p class="mt-2">Unlocking your media...</p>
    </div>

    <div id="result" class="hidden">
      <img id="thumbnail" class="w-full rounded-lg mb-3 border border-white/20" onerror="this.style.display='none'" />
      <h3 id="title" class="font-bold text-lg mb-3 line-clamp-2"></h3>

      <label class="block text-sm opacity-90 mb-1">Choose format</label>
      <select id="formatSelect" class="w-full p-2 rounded bg-white/20 border border-white/30 text-white mb-4"></select>

      <button onclick="download()" class="w-full py-2 rounded-lg bg-green-600 hover:bg-green-700 flex items-center justify-center gap-2">
        <i class="fas fa-download"></i> Download
      </button>
    </div>
  </div>

  <script>
    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text;
      } catch (e) {
        alert('Enable clipboard access in browser settings.');
      }
    }

    async function fetchInfo() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return alert('Please paste a link');

      const loading = document.getElementById('loading');
      const result = document.getElementById('result');
      loading.classList.remove('hidden');
      result.classList.add('hidden');

      try {
        const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        document.getElementById('title').innerText = data.title;
        document.getElementById('thumbnail').src = data.thumbnail;

        const sel = document.getElementById('formatSelect');
        sel.innerHTML = '';
        data.formats.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.format_id;
          opt.textContent = `${f.resolution} (${f.ext})`;
          sel.appendChild(opt);
        });

        result.classList.remove('hidden');
      } catch (e) {
        alert('❌ ' + e.message);
      } finally {
        loading.classList.add('hidden');
      }
    }

    function download() {
      const url = document.getElementById('urlInput').value;
      const fid = document.getElementById('formatSelect').value;
      window.location.href = `/api/download?url=${encodeURIComponent(url)}&format_id=${fid}`;
    }
  </script>
</body>
</html>
