<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediaKey — Download Your Content</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#f43f5e',
            accent: '#0ea5e9',
          }
        }
      }
    }
  </script>
  <style>
    body {
      min-height: 100vh;
      
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
      z-index: -1;
    }
    .glass-card {
     
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .platform-icon {
      font-size: 1.2rem;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="glass-card w-full max-w-2xl rounded-3xl overflow-hidden">
    <!-- Header -->
    <div class="p-6 text-center text-white">
      <h1 class="text-3xl font-bold mb-2">MediaKey</h1>
      <p class="opacity-90 mb-4">Paste a link → Download your content instantly</p>
      <div class="flex justify-center gap-3 text-xl">
        <i class="fab fa-youtube text-gray-500 opacity-40 platform-icon" title="Temporarily unavailable"></i>
        <i class="fab fa-tiktok text-black platform-icon"></i>
        <i class="fab fa-instagram text-pink-500 platform-icon"></i>
        <i class="fab fa-twitter text-blue-400 platform-icon"></i>
        <i class="fab fa-facebook text-blue-700 platform-icon"></i>
        <i class="fab fa-twitch text-purple-500 platform-icon"></i>
        <i class="fab fa-snapchat text-yellow-400 platform-icon"></i>
      </div>
    </div>

    <!-- Input Section -->
    <div class="p-6 bg-white/10 backdrop-blur-sm">
      <div class="flex gap-2 mb-4">
        <input
          type="text"
          id="urlInput"
          placeholder="https://tiktok.com/... or https://instagram.com/..."
          class="flex-1 px-4 py-3 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-primary"
        />
        <button onclick="pasteClipboard()" class="px-4 py-3 bg-white/20 hover:bg-white/30 rounded-xl flex items-center justify-center text-white">
          <i class="fas fa-paste"></i>
        </button>
      </div>

      <div class="flex gap-2">
        <button onclick="fetchInfo()" class="flex-1 py-3 bg-primary hover:bg-indigo-600 text-white font-medium rounded-xl transition flex items-center justify-center gap-2">
          <i class="fas fa-key"></i> Unlock Media
        </button>
        <div class="flex gap-1">
          <button id="mp4Btn" class="px-4 py-3 bg-accent hover:bg-sky-600 text-white rounded-xl text-sm font-medium" onclick="toggleMode('mp4')">MP4</button>
          <button id="mp3Btn" class="px-4 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-xl text-sm font-medium" onclick="toggleMode('mp3')">MP3</button>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden p-8 text-center text-white">
      <div class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-white border-t-transparent mb-2"></div>
      <p>Analyzing your link...</p>
      <p class="text-sm opacity-80 mt-1">This may take 5–10 seconds</p>
    </div>

    <!-- Result -->
    <div id="result" class="hidden p-6">
      <div class="flex gap-4 mb-4">
        <img id="thumbnail" class="w-24 h-24 rounded-xl object-cover border border-white/20" onerror="this.style.display='none'" />
        <div class="flex-1">
          <h3 id="title" class="text-white font-bold text-lg line-clamp-2 mb-1"></h3>
          <p id="duration" class="text-white/80 text-sm"></p>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-white/90 text-sm font-medium mb-2">Choose format</label>
        <select id="formatSelect" class="w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-primary"></select>
      </div>

      <button onclick="download()" class="w-full py-3 bg-secondary hover:bg-rose-600 text-white font-medium rounded-xl flex items-center justify-center gap-2">
        <i class="fas fa-download"></i> Download Now
      </button>
    </div>

    <!-- Error -->
    <div id="error" class="hidden p-6 text-center text-white">
      <i class="fas fa-exclamation-triangle text-2xl mb-2 text-yellow-400"></i>
      <p id="errorMessage" class="text-sm"></p>
    </div>
  </div>

  <script>
    let downloadMode = 'mp4';

    function toggleMode(mode) {
      downloadMode = mode;
      document.getElementById('mp4Btn').className = mode === 'mp4' 
        ? 'px-4 py-3 bg-accent hover:bg-sky-600 text-white rounded-xl text-sm font-medium'
        : 'px-4 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-xl text-sm font-medium';
      document.getElementById('mp3Btn').className = mode === 'mp3'
        ? 'px-4 py-3 bg-accent hover:bg-sky-600 text-white rounded-xl text-sm font-medium'
        : 'px-4 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-xl text-sm font-medium';
    }

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text;
      } catch (e) {
        showError('Clipboard access denied. Please paste manually.');
      }
    }

    function formatBytes(bytes) {
      if (!bytes) return 'Unknown';
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return `${(bytes / Math.pow(1024, i)).toFixed(1)} ${sizes[i]}`;
    }

    async function fetchInfo() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return showError('Please enter a valid link');

      hideAll();
      document.getElementById('loading').classList.remove('hidden');

      try {
        const res = await fetch(`/api/info?url=${encodeURIComponent(url)}&mode=${downloadMode}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        document.getElementById('title').innerText = data.title;
        document.getElementById('thumbnail').src = data.thumbnail || '';
        document.getElementById('duration').innerText = data.duration ? `Duration: ${Math.floor(data.duration / 60)}:${String(data.duration % 60).padStart(2, '0')}` : '';

        const sel = document.getElementById('formatSelect');
        sel.innerHTML = '';
        data.formats.forEach(f => {
          const size = f.filesize ? ` (${formatBytes(f.filesize)})` : '';
          const opt = document.createElement('option');
          opt.value = f.format_id;
          opt.textContent = `${f.resolution}${size}`;
          sel.appendChild(opt);
        });

        document.getElementById('result').classList.remove('hidden');
      } catch (e) {
        showError(e.message || 'Failed to analyze link');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function download() {
      const url = document.getElementById('urlInput').value;
      const fid = document.getElementById('formatSelect').value;
      const downloadUrl = `/api/download?url=${encodeURIComponent(url)}&format_id=${fid}&mode=${downloadMode}`;
      window.location.href = downloadUrl;
    }

    function showError(msg) {
      document.getElementById('errorMessage').innerText = msg;
      hideAll();
      document.getElementById('error').classList.remove('hidden');
    }

    function hideAll() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('result').classList.add('hidden');
      document.getElementById('error').classList.add('hidden');
    }
  </script>
</body>
</html>
