<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MediaKey Apex — Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=JetBrains+Mono&display=swap');

        :root {
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --glass-strong: rgba(10, 12, 18, 0.85);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: #020408;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-canvas { position: fixed; inset: 0; z-index: -1; filter: blur(100px); opacity: 0.5; }

        .app-shell {
            width: 100%;
            max-width: 400px;
            height: 98vh;
            max-height: 820px;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding: 1rem;
        }

        .glass-panel {
            background: var(--glass-strong);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 1.8rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .input-container {
            position: relative;
            background: rgba(0,0,0,0.6);
            border-radius: 1.2rem;
            border: 1px solid var(--border);
            transition: 0.4s;
        }

        .input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .input-container input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 1.1rem 1rem;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .tactical-tabs {
            display: flex;
            background: rgba(255,255,255,0.03);
            border-radius: 1.1rem;
            padding: 4px;
        }

        .tab-trigger {
            flex: 1;
            padding: 12px;
            font-size: 11px;
            font-weight: 800;
            border-radius: 0.9rem;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.3);
        }

        .tab-trigger.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 8px 15px -3px var(--accent-glow);
        }

        .media-viewport {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 1.3rem;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .btn-apex {
            background: white;
            color: black;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            border-radius: 1.2rem;
            height: 56px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
        }

        .btn-apex:active { transform: scale(0.96); }

        .btn-download { background: var(--accent); color: white; }

        .history-node {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: slideUp 0.4s ease forwards; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="app-shell">
        
        <div class="flex items-center justify-between px-2">
            <div>
                <h1 class="text-xl font-black tracking-tighter">MEDIAKEY <span class="text-indigo-500">APEX</span></h1>
                <p class="text-[9px] font-mono text-indigo-400/60 uppercase">Industrial Studio Engine v7.2</p>
            </div>
            <div class="w-9 h-9 glass-panel flex items-center justify-center border-white/5">
                <i class="fas fa-microchip text-indigo-400 text-xs"></i>
            </div>
        </div>

        <div class="glass-panel p-4 space-y-4">
            <div class="input-container">
                <input type="text" id="urlInput" placeholder="Paste link here...">
                <button onclick="handlePaste()" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/20 hover:text-white">
                    <i class="fas fa-paste text-sm"></i>
                </button>
            </div>

            <div class="tactical-tabs">
                <button id="mp4Tab" onclick="switchMode('mp4')" class="tab-trigger active">Video</button>
                <button id="mp3Tab" onclick="switchMode('mp3')" class="tab-trigger">Audio</button>
            </div>

            <button onclick="startAnalysis()" id="analyzeBtn" class="btn-apex">Process Source</button>
        </div>

        <div id="result-container" class="hidden glass-panel p-3 flex flex-col gap-3 animate-up flex-1 min-h-0">
            <div class="media-viewport">
                <video id="video-preview" class="w-full h-full object-cover hidden" playsinline></video>
                <div id="video-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/40 backdrop-blur-[2px] cursor-pointer" onclick="loadPreview()">
                    <img id="thumb-placeholder" class="absolute inset-0 w-full h-full object-cover opacity-50 blur-[2px]">
                    <div class="z-10 w-14 h-14 rounded-full bg-white/10 border border-white/20 flex items-center justify-center backdrop-blur-xl">
                        <i class="fas fa-play text-white text-sm ml-1"></i>
                    </div>
                    <span class="z-10 text-[10px] font-black uppercase tracking-[3px] mt-3 text-white/80">Preview</span>
                </div>
            </div>

            <div class="px-1">
                <h2 id="media-title" class="text-xs font-bold truncate">Filename Placeholder</h2>
                <div class="flex items-center gap-2 mt-1">
                    <span id="badge-mode" class="text-[8px] px-1.5 py-0.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded font-black">MP4</span>
                    <p id="badge-uploader" class="text-[9px] text-white/30 font-bold truncate uppercase tracking-tighter">Identity</p>
                </div>
            </div>

            <div class="mt-auto space-y-2">
                <select id="qualitySelect" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-[11px] font-bold text-white outline-none"></select>
                
                <div class="flex gap-2">
                    <button onclick="triggerDownload()" id="dl-button" class="btn-apex btn-download flex-[3]">
                        <i class="fas fa-bolt-lightning mr-2"></i> Start Download
                    </button>
                    <button onclick="invokeShare()" id="share-button" class="hidden btn-apex flex-1 bg-white/5 text-white border border-white/10">
                        <i class="fas fa-share-nodes"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-auto">
            <p class="text-[10px] font-black text-white/10 uppercase tracking-widest ml-2 mb-2">Vault History</p>
            <div id="history-list" class="flex gap-2 overflow-x-auto pb-2 no-scroll"></div>
        </div>

    </div>

    <script>
        let currentMode = 'mp4';
        let currentBlob = null;
        let mediaCache = null;

        // --- Background Animation ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Point {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.2; this.vy = (Math.random() - 0.5) * 1.2;
                this.radius = Math.random() * 200 + 100; this.color = Math.random() > 0.5 ? '#4f46e5' : '#7c3aed';
            }
            draw() {
                this.x += this.vx; this.y += this.vy;
                if(this.x<0 || this.x>canvas.width) this.vx*=-1;
                if(this.y<0 || this.y>canvas.height) this.vy*=-1;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.fill();
            }
        }
        function init() { resize(); points = Array.from({length: 6}, () => new Point()); loop(); }
        function loop() { ctx.clearRect(0,0,canvas.width, canvas.height); points.forEach(p => p.draw()); requestAnimationFrame(loop); }
        window.addEventListener('resize', resize);
        init();

        // --- Core Functions ---
        function switchMode(m) {
            currentMode = m;
            document.getElementById('mp4Tab').classList.toggle('active', m === 'mp4');
            document.getElementById('mp3Tab').classList.toggle('active', m === 'mp3');
        }

        async function handlePaste() {
            const text = await navigator.clipboard.readText();
            if(text) document.getElementById('urlInput').value = text;
        }

        async function startAnalysis() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            const btn = document.getElementById('analyzeBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
            
            try {
                const r = await fetch(`/api/info?url=${encodeURIComponent(url)}&mode=${currentMode}`);
                const data = await r.json();
                if(data.error) throw new Error(data.error);

                mediaCache = data;
                document.getElementById('media-title').innerText = data.title;
                document.getElementById('thumb-placeholder').src = data.thumbnail;
                document.getElementById('badge-uploader').innerText = data.uploader;
                document.getElementById('badge-mode').innerText = currentMode.toUpperCase();
                
                document.getElementById('qualitySelect').innerHTML = data.formats.map(f => `
                    <option value="${f.format_id}">${f.resolution} ${f.filesize ? '— '+(f.filesize/1024/1024).toFixed(1)+'MB' : ''}</option>
                `).join('');

                document.getElementById('result-container').classList.remove('hidden');
                document.getElementById('result-container').style.display = 'flex';
                document.getElementById('video-preview').classList.add('hidden');
                document.getElementById('video-overlay').style.display = 'flex';
            } catch(e) { alert("Analysis failed. Try again."); }
            finally { btn.innerText = 'Process Source'; }
        }

        async function loadPreview() {
            const url = document.getElementById('urlInput').value;
            const vid = document.getElementById('video-preview');
            const over = document.getElementById('video-overlay');
            over.innerHTML = `<i class="fas fa-circle-notch fa-spin text-white"></i>`;
            vid.src = `/api/preview?url=${encodeURIComponent(url)}`;
            vid.onloadeddata = () => {
                over.style.display = 'none';
                vid.classList.remove('hidden');
                vid.play(); vid.loop = true;
            };
        }

        async function triggerDownload() {
            const btn = document.getElementById('dl-button');
            const url = document.getElementById('urlInput').value;
            const fid = document.getElementById('qualitySelect').value;
            const original = btn.innerHTML;
            
            btn.innerHTML = `<i class="fas fa-sync fa-spin mr-2"></i> PROCESSING...`;
            btn.disabled = true;

            try {
                const titleParam = encodeURIComponent((mediaCache && mediaCache.title) || '');
                const r = await fetch(`/api/download?url=${encodeURIComponent(url)}&format_id=${encodeURIComponent(fid)}&mode=${currentMode}&title=${titleParam}`);
                if(!r.ok) throw new Error();
                currentBlob = await r.blob();
                
                const a = document.createElement('a');
                a.href = URL.createObjectURL(currentBlob);
                a.download = `${mediaCache.title}.${currentMode}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                saveToHistory(mediaCache.thumbnail);
                if(navigator.share) document.getElementById('share-button').classList.remove('hidden');
                btn.innerHTML = `<i class="fas fa-check mr-2"></i> SUCCESS`;
            } catch(e) { btn.innerHTML = `ERROR`; }
            finally { setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 3000); }
        }

        function saveToHistory(t) {
            let h = JSON.parse(localStorage.getItem('mk_apex_h') || '[]');
            if(!h.includes(t)) {
                h.unshift(t);
                localStorage.setItem('mk_apex_h', JSON.stringify(h.slice(0, 10)));
                renderHistory();
            }
        }

        function renderHistory() {
            const h = JSON.parse(localStorage.getItem('mk_apex_h') || '[]');
            document.getElementById('history-list').innerHTML = h.map(img => `
                <div class="history-node"><img src="${img}" class="w-full h-full object-cover opacity-60"></div>
            `).join('');
        }
        renderHistory();

        async function invokeShare() {
            if(!currentBlob) return;
            const file = new File([currentBlob], `${mediaCache.title}.${currentMode}`, { type: currentBlob.type });
            if(navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: mediaCache.title });
            }
        }
    </script>
</body>
</html>
